services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the private .env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the private .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - foundation

  sdk:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    env_file:
      - .env
    user: ${LOCAL_UID:?Set LOCAL_UID in the private .env file}:${LOCAL_GID:?Set LOCAL_GID in the private .env file}
    working_dir: ${PROJECT_DIR:?Set PROJECT_DIR in the private .env file}
    volumes:
      - ${PROJECT_DIR:?Set PROJECT_DIR in the private .env file}:${PROJECT_DIR:?Set PROJECT_DIR in the private .env file}
    environment:
      DOTNET_CLI_HOME: /tmp
      HOME: /tmp
      ConnectionStrings__AuthenticationDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB};Username=${POSTGRES_USER:?Set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      ASPNETCORE_ENVIRONMENT: Development
      Sessions__Signing__PrivateKeyPem: ${SESSIONS_SIGNING_KEY_PEM:-}
      PasswordRecovery__DeliveryFile: ${PASSWORD_RECOVERY_DELIVERY_FILE:-}
      DataProtection__KeysPath: ${DATA_PROTECTION_KEYS_PATH:-}
      ProfileImages__RootPath: ${PROFILE_IMAGES_ROOT:-${PROJECT_DIR}/.profile-images}
      ProfileImages__StorageIsPersistent: ${PROFILE_IMAGES_STORAGE_IS_PERSISTENT:-}
      ProfileImages__MaxBytes: ${PROFILE_IMAGES_MAX_BYTES:-5242880}
      ProfileImages__MaxDimension: ${PROFILE_IMAGES_MAX_DIMENSION:-4096}
      Administration__GlobalAdministratorUserIds__0: ${GLOBAL_ADMINISTRATOR_USER_ID:-}
      Bootstrap__AdministratorEmail: ${BOOTSTRAP_ADMINISTRATOR_EMAIL:-}
      Bootstrap__AdministratorPassword: ${BOOTSTRAP_ADMINISTRATOR_PASSWORD:-}
      Bootstrap__AdministratorPasswordFile: ${BOOTSTRAP_ADMINISTRATOR_PASSWORD_FILE:-}
      Bootstrap__AdministratorFirstName: ${BOOTSTRAP_ADMINISTRATOR_FIRST_NAME:-}
      Bootstrap__AdministratorLastName: ${BOOTSTRAP_ADMINISTRATOR_LAST_NAME:-}
      ForwardedHeaders__KnownProxies__0: ${FORWARDED_HEADERS_KNOWN_PROXIES_0:-}
      ForwardedHeaders__KnownNetworks__0: ${FORWARDED_HEADERS_KNOWN_NETWORKS_0:-}
      Administration__MaxBulkSessionRevocation: ${ADMIN_MAX_BULK_SESSION_REVOCATION:-1000}
      RateLimiting__Administration__PermitLimit: ${ADMIN_RATE_LIMIT_PERMITS:-120}
      RateLimiting__Administration__WindowSeconds: ${ADMIN_RATE_LIMIT_WINDOW_SECONDS:-60}
    command: ["dotnet", "run", "--project", "src/GaussAuth.Api", "--urls", "http://0.0.0.0:8080"]
    networks:
      - foundation

networks:
  foundation:

volumes:
  postgres_data:
